name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l on every PHP file
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { php -l "$f"; status=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status

  contract:
    name: Contract tests (real WordPress)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge

      # The tests live in wp-agent-mcp. Pair with its branch of the same name ONLY while that branch has an
      # open pull request from the same owner (so paired PRs test each other); otherwise use main.
      # Checking for an open PR matters: a branch whose PR already merged still exists and is stale.
      - name: Pick the matching wp-agent-mcp ref
        id: pair
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          open_prs=$(gh api -X GET "repos/${OWNER}/wp-agent-mcp/pulls" -f state=open -f head="${OWNER}:${BRANCH}" --jq 'length' 2>/dev/null || echo 0)
          if [ "${open_prs:-0}" -gt 0 ]; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/wp-agent-mcp
          ref: ${{ steps.pair.outputs.ref }}
          path: mcp
      - run: echo "Testing this bridge against wp-agent-mcp@${{ steps.pair.outputs.ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mcp

      - name: Run the contract tests against this bridge
        env:
          CONTAINER_CLI: docker
        run: bridge/dev/run-contract-tests.sh mcp
